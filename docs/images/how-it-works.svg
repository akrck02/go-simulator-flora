<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .warm { fill: #fff1e5; stroke: #fb8f44; }
    .leaf { fill: #dafbe1; stroke: #4ac26b; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .small { fill: #59636e; font-size: 11px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .dashed { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .head { fill: #8c959f; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .axis { stroke: #8c959f; stroke-width: 1; fill: none; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .gap { stroke: #ffffff; }
    .ink { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .warm { fill: #3d1d00; stroke: #db6d28; }
      .leaf { fill: #0f2d1a; stroke: #2ea043; }
      .title { fill: #e6edf3; }
      .text, .label, .small { fill: #9198a1; }
      .code { fill: #4493f8; }
      .arrow, .dashed, .axis { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .grid, .frame { stroke: #30363d; }
      .gap { stroke: #0d1117; }
      .ink { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="360" rx="12"/>
  <rect class="box" x="24.0" y="40.0" width="186.0" height="104.0" rx="10" stroke-width="1.2"/>
  <text class="code" x="117.0" y="68.0" text-anchor="middle">valley.yaml</text>
  <text class="title" x="117.0" y="92.0" text-anchor="middle">The rules file</text>
  <text class="text" x="117.0" y="114.0" text-anchor="middle">plugins, a yearly clock,</text>
  <text class="text" x="117.0" y="131.0" text-anchor="middle">rules and anchors</text>
  <rect class="box" x="24.0" y="196.0" width="186.0" height="134.0" rx="10" stroke-width="1.2"/>
  <text class="code" x="117.0" y="224.0" text-anchor="middle">terrain · climate</text>
  <text class="title" x="117.0" y="248.0" text-anchor="middle">Other plugins</text>
  <text class="label" x="117.0" y="272.0" text-anchor="middle">elevation, slope,</text>
  <text class="label" x="117.0" y="290.0" text-anchor="middle">temperature, biome,</text>
  <text class="label" x="117.0" y="308.0" text-anchor="middle">precipitation, biomes</text>
  <path class="arrow" d="M210,92 C236,92 236,140 262,140" marker-end="url(#arrow)"/>
  <path class="arrow" d="M210,262 C236,262 236,220 262,220" marker-end="url(#arrow)"/>
  <text class="label" x="236.0" y="248.0" text-anchor="middle">fields</text>
  <rect class="box" x="266.0" y="70.0" width="232.0" height="220.0" rx="10" stroke-width="1.2"/>
  <text class="code" x="382.0" y="98.0" text-anchor="middle">go-simulator</text>
  <text class="title" x="382.0" y="122.0" text-anchor="middle">The host</text>
  <text class="text" x="382.0" y="146.0" text-anchor="middle">keeps the world, moves the</text>
  <text class="text" x="382.0" y="163.0" text-anchor="middle">clock: one step is one year</text>
  <text class="label" x="382.0" y="200.0" text-anchor="middle">cmd/simulate saves snapshots</text>
  <text class="label" x="382.0" y="218.0" text-anchor="middle">and events.jsonl</text>
  <text class="text" x="382.0" y="256.0" text-anchor="middle">forwards what each plugin</text>
  <text class="text" x="382.0" y="273.0" text-anchor="middle">writes to those that read it</text>
  <path class="arrow" d="M498,134 H592" marker-end="url(#arrow)"/>
  <text class="label" x="545.0" y="124.0" text-anchor="middle">step</text>
  <text class="label" x="545.0" y="170.0" text-anchor="middle">stdin/stdout</text>
  <path class="arrow" d="M592,206 H498" marker-end="url(#arrow)"/>
  <text class="label" x="545.0" y="226.0" text-anchor="middle">changes</text>
  <rect class="accent" x="596.0" y="24.0" width="262.0" height="312.0" rx="10" stroke-width="1.2"/>
  <text class="code" x="727.0" y="52.0" text-anchor="middle">go-simulator-flora</text>
  <text class="title" x="727.0" y="76.0" text-anchor="middle">The flora plugin</text>
  <text class="text" x="727.0" y="98.0" text-anchor="middle">reads its copy of the world,</text>
  <text class="text" x="727.0" y="115.0" text-anchor="middle">answers with changes</text>
  <text class="small" x="616.0" y="146.0" text-anchor="start">rule</text>
  <text class="small" x="838.0" y="146.0" text-anchor="end">writes</text>
  <path class="grid" d="M616,153 H838"/>
  <text class="label" x="616.0" y="174.0" text-anchor="start">vegetation</text>
  <text class="label" x="838.0" y="174.0" text-anchor="end">vegetation</text>
  <text class="label" x="838.0" y="192.0" text-anchor="end">tree_cover</text>
  <text class="label" x="838.0" y="210.0" text-anchor="end">shrub_cover</text>
  <text class="label" x="838.0" y="228.0" text-anchor="end">herb_cover</text>
  <text class="label" x="616.0" y="256.0" text-anchor="start">vegetation_indicators</text>
  <text class="label" x="838.0" y="274.0" text-anchor="end">an event</text>
  <path class="grid" d="M616,290 H838"/>
  <text class="small" x="727.0" y="310.0" text-anchor="middle">reads: temperature, precipitation, elevation,</text>
  <text class="small" x="727.0" y="325.0" text-anchor="middle">slope, biome, the biomes event and anchors</text>
</svg>
