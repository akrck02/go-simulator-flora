<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .warm { fill: #fff1e5; stroke: #fb8f44; }
    .leaf { fill: #dafbe1; stroke: #4ac26b; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .small { fill: #59636e; font-size: 11px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .dashed { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .head { fill: #8c959f; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .axis { stroke: #8c959f; stroke-width: 1; fill: none; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .gap { stroke: #ffffff; }
    .ink { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .warm { fill: #3d1d00; stroke: #db6d28; }
      .leaf { fill: #0f2d1a; stroke: #2ea043; }
      .title { fill: #e6edf3; }
      .text, .label, .small { fill: #9198a1; }
      .code { fill: #4493f8; }
      .arrow, .dashed, .axis { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .grid, .frame { stroke: #30363d; }
      .gap { stroke: #0d1117; }
      .ink { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="300" rx="12"/>
  <text class="title" x="16.0" y="32.0" text-anchor="start">year 20</text>
  <image x="16.0" y="44.0" width="200.0" height="100.0" href="data:image/png;base64,"/>
  <rect class="frame" x="16.0" y="44.0" width="200.0" height="100.0" rx="3"/>
  <text class="title" x="232.0" y="32.0" text-anchor="start">year 40</text>
  <image x="232.0" y="44.0" width="200.0" height="100.0" href="data:image/png;base64,"/>
  <rect class="frame" x="232.0" y="44.0" width="200.0" height="100.0" rx="3"/>
  <text class="title" x="448.0" y="32.0" text-anchor="start">year 60</text>
  <image x="448.0" y="44.0" width="200.0" height="100.0" href="data:image/png;base64,"/>
  <rect class="frame" x="448.0" y="44.0" width="200.0" height="100.0" rx="3"/>
  <text class="title" x="664.0" y="32.0" text-anchor="start">year 120</text>
  <image x="664.0" y="44.0" width="200.0" height="100.0" href="data:image/png;base64,"/>
  <rect class="frame" x="664.0" y="44.0" width="200.0" height="100.0" rx="3"/>
  <rect x="324.5" y="162.0" width="12" height="12" rx="3" fill="#bccb5a"/>
  <text class="text" x="342.5" y="172.0" text-anchor="start">birch</text>
  <rect x="399.5" y="162.0" width="12" height="12" rx="3" fill="#5e9a32"/>
  <text class="text" x="417.5" y="172.0" text-anchor="start">oak</text>
  <rect x="460.5" y="162.0" width="12" height="12" rx="3" fill="#d6c9ae"/>
  <text class="text" x="478.5" y="172.0" text-anchor="start">bare ground</text>
  <text class="text" x="440.0" y="204.0" text-anchor="middle">One planted birch (left) and one planted oak (right) on open ground, no seeds from far away.</text>
  <text class="text" x="440.0" y="224.0" text-anchor="middle">Birch: dispersal 400 m, seeds from year 8. Oak: dispersal 60 m, seeds from year 40.</text>
  <text class="text" x="440.0" y="244.0" text-anchor="middle">Each new tree bears seeds in its turn, so a forest spreads as a front, faster for far-flying seeds.</text>
  <text class="small" x="440.0" y="280.0" text-anchor="middle">A flat made-up field 4.8 × 2.4 km in cells of 40 m. Full colour from 30 % of the ground covered; birch forms open woodland of about 31 %.</text>
</svg>
